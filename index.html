<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ZEBEN · Mi Plan de Pádel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Layout: pista vista desde arriba — cabecera azul pista, contenido en tarjetas claras tipo cristal, una columna pensada para móvil */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#E3E9F0; --line:#CCD6E1;
  --fg:#14233A; --muted:#566781;
  --court:#1D4F91; --court-ink:#FFFFFF; --ball:#C9D82B; --ball-ink:#1B2400;
  --f-fuerza:#1D4F91; --f-explo:#C2410C; --f-agil:#0F7A5A;
  --danger:#B42318; --ball-deep:#7C8A00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#152234; --surface-2:#1C2C42; --line:#2A3C55;
  --fg:#E6EDF6; --muted:#93A4BC;
  --court:#2B62AD; --court-ink:#FFFFFF; --ball:#D3E23A; --ball-ink:#1B2400;
  --f-fuerza:#7FAEF0; --f-explo:#F59E6B; --f-agil:#4FD1A5; --danger:#F97066; --ball-deep:#D3E23A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#152234; --surface-2:#1C2C42; --line:#2A3C55;
  --fg:#E6EDF6; --muted:#93A4BC;
  --court:#2B62AD; --court-ink:#FFFFFF; --ball:#D3E23A; --ball-ink:#1B2400;
  --f-fuerza:#7FAEF0; --f-explo:#F59E6B; --f-agil:#4FD1A5; --danger:#F97066; --ball-deep:#D3E23A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{background:var(--court);color:var(--court-ink);position:relative;overflow:hidden}
header.top .wrap{padding-block:22px 18px}
header.top::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.35) calc(50% - 1px),rgba(255,255,255,.35) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(transparent 0,transparent calc(100% - 2px),rgba(255,255,255,.35) calc(100% - 2px))}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{display:block;width:72px;height:72px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.brand-name{font:800 15px var(--display);letter-spacing:.22em;opacity:.85}
h1 .ball{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--ball);margin-left:.15em;vertical-align:.08em;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.sub{margin:6px 0 0;opacity:.85;font-size:14px}
nav.tabs{display:flex;gap:6px;margin-top:16px;position:relative;z-index:1}
nav.tabs button{flex:1;font:600 15px var(--body);border:0;border-radius:999px;padding:10px 12px;background:rgba(255,255,255,.14);color:var(--court-ink);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ball);color:var(--ball-ink)}
button,input,select{font-family:var(--body)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:26px 0 10px;line-height:1.1}
h3{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.wk{border:0;border-radius:8px;padding:8px 0 6px;background:var(--surface-2);color:var(--fg);cursor:pointer;font:700 15px var(--display);display:flex;flex-direction:column;align-items:center;gap:2px}
.wk small{font:600 9px var(--body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wk[aria-pressed="true"]{background:var(--court);color:var(--court-ink)}
.wk[aria-pressed="true"] small{color:var(--court-ink);opacity:.8}
.phase{margin-top:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.phase b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:5px solid var(--c)}
.day-head h3{color:var(--c)}
.dose{font-size:13px;font-weight:600;background:var(--surface-2);border-radius:8px;padding:5px 9px;text-align:right;font-variant-numeric:tabular-nums}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line)}
.ex .n{font-weight:600;min-width:0}
.ex .cue{grid-column:1/-1;font-size:13px;color:var(--muted)}
.ex .rx{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vid{grid-column:1/-1;justify-self:start;margin-top:4px;font-size:13px;font-weight:700;text-decoration:none;color:var(--fg);background:var(--surface-2);border-radius:999px;padding:5px 11px}
.vid:hover{background:var(--line)}
.sec{padding:8px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.done-row{padding:12px 14px;border-top:1px solid var(--line)}
.done-row .btn{width:100%}
.btn.ok{background:var(--f-agil);color:var(--surface)}
.prog{margin-top:14px;position:relative;z-index:1;max-width:360px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ball);border-radius:999px}
.ptxt{font-size:13px;margin-top:5px;opacity:.9;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);padding:10px 14px;border-top:1px dashed var(--line);background:var(--surface-2)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--court);color:var(--court-ink)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.athletes{display:grid;gap:10px;margin-top:12px}
.ath{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg);width:100%;font:inherit}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--court);color:var(--court-ink);display:grid;place-items:center;font:800 18px var(--display)}
.ath .nm{font-weight:700;font-size:16px}
.ath .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--ball);color:var(--ball-ink);white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:16px;background:var(--bg);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 10px}
.stat .v{font:800 24px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font:600 12px var(--body);color:var(--muted);margin-left:2px}
.tbl{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.x{text-align:right;width:1%}
td.x button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);margin-top:12px}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:12px}
.back{background:none;border:0;color:var(--court);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}
:root:not([data-theme="light"]) .back{color:var(--f-fuerza)}
.best{color:var(--f-agil);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.day,.panel,.ath{transition:transform .15s}.ath:active{transform:scale(.99)}}


.auth{max-width:420px;margin:24px auto 0}
.auth .panel h3{margin-bottom:4px}
.auth .field{margin-top:10px}
.auth .btn{width:100%;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--court);font-weight:700;cursor:pointer;padding:8px 0;font-size:15px;text-decoration:underline}
:root:not([data-theme="light"]) .linkbtn{color:var(--f-fuerza)}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
.ok-msg{color:var(--f-agil);font-size:14px;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--court)}
.code{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;background:var(--surface-2);border-radius:10px;padding:14px;margin:12px 0;word-break:break-all}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--danger);color:#fff}
.lock{text-align:center;padding:28px 18px}
.lock .big{font-size:42px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.who{position:absolute;top:18px;right:16px;z-index:2;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:var(--ball);color:var(--ball-ink);font:800 16px var(--display);cursor:pointer}
header.top .wrap{position:relative}
.list-plain{margin:8px 0 0;padding-left:20px;font-size:14px}
.errrow{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.errrow small{color:var(--muted)}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:28px}
.foot a{color:inherit}
.cf{margin-top:12px;min-height:66px}
nav.tabs{overflow-x:auto}
nav.tabs button{white-space:nowrap}

</style>
</head>

const ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlock(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(LOCK.s),iterations:LOCK.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(LOCK.i)},k,ub(LOCK.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
let P=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const videoUrl=q=>/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(q)?q:"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const vid=q=>`<a class="vid" href="${esc(videoUrl(q))}" target="_blank" rel="noopener noreferrer">▶ Ver vídeo</a>`;
const st={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(_){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let level=st.get("zb-a-level",1), week=st.get("zb-a-week",1), done=st.get("zb-a-done",{});
const VAR=w=>"ABC"[(w-1)%3], phaseOf=w=>P.phases.findIndex(p=>p.weeks.includes(w));
const row=w=>`<div class="ex"><span class="n">${esc(w[0])}</span><span class="rx" style="font-size:16px">${esc(w[1])}</span>${w[3]?`<span class="cue">${esc(w[3])}</span>`:""}${vid(w[2])}</div>`;
function render(){
  const p=phaseOf(week);
  const days=P.days.map(d=>{const [main,extra]=String(P.dose[d.key][level][p]).split(" · ");const k=week+"-"+d.key,on=!!done[k];
    return `<article class="day" style="--c:var(${d.c})"><div class="day-head"><div><div class="label">${esc(d.when)}</div><h3>${esc(d.title)} · ${VAR(week)}</h3></div><div class="dose">Descanso<br>${esc(P.rest[d.key][p])}</div></div>
    ${d.ex[VAR(week)].map(e=>`<div class="ex"><span class="n">${esc(e[0])}</span><span class="rx">${esc(main)}${e[2]?` <small class="muted" style="font:500 12px var(--body)">${esc(e[2])}</small>`:""}</span><span class="cue">${esc(e[1])}${extra?` · ${esc(extra)}`:""}</span>${vid(e[3])}</div>`).join("")}
    <div class="note">${esc(d.note)}</div><div class="done-row"><button class="btn ${on?"ok":""}" data-done="${k}" aria-pressed="${on}">${on?"✓ Sesión completada":"Marcar sesión como hecha"}</button></div></article>`}).join("");
  const m=P.matchday;
  $("#app").innerHTML=`
  <h2>Tu nivel</h2><div class="chips">${P.levels.map((l,i)=>`<button class="chip" aria-pressed="${i===level}" data-l="${i}">${esc(l)}</button>`).join("")}</div>
  <h2>Semana</h2><div class="weeks">${Array.from({length:8},(_,i)=>{const w=i+1;return `<button class="wk" aria-pressed="${w===week}" data-w="${w}">S${w}<small>${["fuerza","explo","agil"].filter(k=>done[w+"-"+k]).length}/3</small></button>`}).join("")}</div>
  <div class="phase"><div class="label">Semana ${week} · ${esc(P.levels[level])}</div><b>${esc(P.phases[p].name)} · ${esc(P.variants[VAR(week)])}</b><div class="muted" style="font-size:14px">${esc(P.phases[p].txt)}</div></div>
  <h2>Calentamiento</h2><div class="day" style="--c:var(--ball-deep)"><div class="day-head"><div><div class="label">Antes de cada sesión · 15–20 min</div><h3>Foam roller + movilidad</h3></div><div class="dose">Ritmo<br>lento</div></div>
  <div class="sec">1 · Foam roller</div>${P.warm.map(row).join("")}<div class="sec">2 · Movilidad de tobillo (dorsiflexión)</div>${P.ankle.map(row).join("")}<div class="sec">3 · Movilidad y activación</div>${P.mov.map(row).join("")}
  <div class="note">Rueda despacio (unos 2–3 cm por segundo) y para 10–20 s en los puntos cargados. Evita rodar sobre articulaciones y zona lumbar. Deja al menos 48 h entre la sesión de explosividad y un partido de competición.</div></div>
  <h2>Sesiones</h2>${days}
  <h2>Día de partido</h2><article class="day" style="--c:var(--danger)"><div class="day-head"><div><div class="label">${esc(m.label)}</div><h3>${esc(m.title)}</h3></div><div class="dose">Antes de<br>competir</div></div>
  ${m.blocks.map(b=>`<div class="sec">${esc(b.sec)}</div>${b.rows.map(row).join("")}`).join("")}<div class="note">${esc(m.note)}</div></article>`;
  const n=Object.keys(done).length;
  $("#progress").innerHTML=`<div class="bar"><span style="width:${Math.round(n/24*100)}%"></span></div><div class="ptxt">${n} de 24 sesiones completadas</div>`;
}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]"); if(l){level=+l.dataset.l;st.set("zb-a-level",level);return render()}
  const w=e.target.closest("[data-w]"); if(w){week=+w.dataset.w;st.set("zb-a-week",week);return render()}
  const d=e.target.closest("[data-done]"); if(d){const k=d.dataset.done;if(done[k])delete done[k];else done[k]=true;st.set("zb-a-done",done);render()}
});
function gate(msg){
  $("#progress").innerHTML="";const o=document.getElementById("out");if(o){o.previousSibling&&o.previousSibling.remove();o.remove()}
  $("#app").innerHTML=`<div class="day" style="--c:var(--court);max-width:420px;margin:28px auto 0"><div class="day-head"><div><div class="label">Acceso clientes</div><h3>Entra a tu plan</h3></div></div>
  <form id="gf" style="padding:14px;display:grid;gap:10px" autocomplete="on">
    <input type="text" name="username" value="atleta" autocomplete="username" hidden>
    <label class="label" for="pw">Contraseña</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" style="font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">
    <button class="btn" type="submit" id="go">Entrar</button>
    <div id="gmsg" style="color:var(--danger);font-size:14px;min-height:1em">${msg||""}</div>
    <div class="muted" style="font-size:13px">¿No tienes contraseña? Pídesela a Zeben.</div>
  </form></div>`;
  $("#gf").addEventListener("submit",async ev=>{ev.preventDefault();const b=$("#go");b.disabled=true;b.textContent="Comprobando…";
    try{P=await unlock($("#pw").value.trim());st.set("zb-a-pw",$("#pw").value.trim());render();addOut()}
    catch(_){b.disabled=false;b.textContent="Entrar";$("#gmsg").textContent="Contraseña incorrecta. Revisa mayúsculas y guiones."}});
}
function addOut(){const f=document.querySelector(".foot");if(f&&!f.querySelector("#out")){f.insertAdjacentHTML("beforeend",' · <a href="#" id="out" style="color:inherit">Cerrar sesión</a>');$("#out").onclick=e=>{e.preventDefault();try{localStorage.removeItem("zb-a-pw")}catch(_){}P=null;gate()}}}
(async()=>{const saved=st.get("zb-a-pw",null);
  if(saved){try{P=await unlock(saved);render();addOut();return}catch(_){try{localStorage.removeItem("zb-a-pw")}catch(__){}}}
  gate();})();
</script>
